# Pre-commit configuration template
# See https://pre-commit.com for more information
#
# DEVELOPER-FRIENDLY SETUP:
# - By default, hooks run ONLY on staged files (fast during development)
# - Use `make hooks-run` for staged files only (default)
# - Use `make hooks-run-all` for full repo check (CI, release prep)
#
# Install: make hooks-install
# Run on staged: make hooks-run (or just `pre-commit run`)
# Run on all: make hooks-run-all (or `pre-commit run --all-files`)

default_language_version:
  python: python3.11

# Default stages - only run on pre-commit (staged files)
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]

# Fail fast - stop on first failure for faster feedback
fail_fast: false

repos:
  # Usage: pre-commit run autoupdate --hook-stage manual
  - repo: local
    hooks:
      - id: autoupdate
        name: autoupdate
        entry: pre-commit autoupdate
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]


  # =============================================================================
  # General file checks (fast)
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # =============================================================================
  # Security scanning
  # =============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Only scan staged files, not full repo
        args: ['--exclude-lines', 'ghp_example|your-token-here|xxx']
        exclude: |
          (?x)^(
            .*\.lock$|
            .*-lock\.json$|
            .*\.min\.js$|
            \.secrets\.baseline$
          )$

  # =============================================================================
  # Commit message format (conventional commits)
  # =============================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
